name: Catalog verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-validation.yml"
      - "src/lib/product-catalog*"
      - "src/lib/product-catalog-explorer*"
      - "src/lib/offline/product-*"
      - "src/lib/product-stock-history-state*"
      - "src/lib/actions/product-*"
      - "src/lib/media/client.test.ts"
      - "src/lib/pos/price-book-switch.test.ts"
      - "src/lib/pos/product-catalog-adapter*"
      - "src/app/(pos)/pos/pos-client.tsx"
      - "src/components/product-catalog-provider.tsx"
      - "src/components/logout-button.tsx"
      - "src/app/(app)/inventory/tabs/products-table.tsx"
      - "src/app/api/mobile/products/catalog/**"
      - "src/db/catalog-delta-v2-migration.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

# Direct-to-main commits can arrive in quick succession. Validate the latest
# revision without burning Actions minutes on already superseded builds.
concurrency:
  group: catalog-verification-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Focused catalog lint
        run: bunx eslint src/lib/product-catalog.ts src/lib/product-catalog-explorer.ts src/lib/actions/product-catalog.ts src/lib/actions/product-stock-history.ts src/lib/offline/product-catalog-store.ts src/lib/offline/product-stock-history-store.ts src/lib/product-stock-history-state.ts src/lib/pos/product-catalog-adapter.ts src/components/product-catalog-provider.tsx 'src/app/(app)/inventory/tabs/products-table.tsx'
      - name: ESLint full repository
        run: bun run lint
      - name: Focused catalog regressions
        run: bun test src/lib/product-catalog.test.mjs src/lib/product-catalog-explorer.test.mjs src/lib/catalog-delta.test.mjs src/lib/catalog-delta-db.test.mjs src/lib/pos/product-catalog-adapter.test.mjs src/lib/offline/product-catalog-store.test.mjs src/lib/product-stock-history-state.test.mjs src/lib/actions/product-catalog.test.mjs
      - name: V2 API and migration regressions
        run: |
          bun test 'src/app/api/mobile/products/catalog/v2/route.test.mjs'
          bun test 'src/app/api/mobile/products/catalog/route.test.mjs'
          bun test 'src/db/catalog-delta-v2-migration.test.mjs'
      - name: Production build (compile-only)
        # The app constructs a PG pool during route import. This dummy URL
        # lets Next compile routes without connecting to a real database.
        # Runtime/integration checks must use separately configured secrets.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/lumapos_compile_only
        run: bun run build
