name: Web Mobile parity checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "messages/**"
      - ".github/workflows/mobile-parity-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-mobile-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Next.js route types
        run: bunx next typegen
      - name: TypeScript typecheck
        run: bunx tsc --noEmit
      - name: ESLint
        run: bun run lint
      - name: Mobile parity regression tests
        run: |
          bun test 'src/lib/dashboard/range-native.test.mjs' \
            'src/app/(app)/dashboard/dashboard-mobile-recent-orders.test.mjs' \
            'src/app/(app)/inventory/tabs/products-mobile-row-native.test.mjs' \
            'src/app/(app)/sales/tabs/orders-mobile-parity.test.mjs' \
            'src/app/(app)/sales/tabs/mobile-document-row.test.mjs' \
            'src/components/mobile-more-quick-search.test.mjs' \
            'src/app/(pos)/pos/pos-native-draft-picker.test.mjs'
